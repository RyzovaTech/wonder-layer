name: Phase 7 security analysis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL JavaScript security-and-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize GitHub CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
  dependency-audit:
    name: Runtime dependency and release policy audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release blocked
        run: node tools/release-gate.mjs
      - name: Generate lockfile for this zero-runtime-dependency SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit npm runtime dependency manifest
        run: npm audit --omit=dev --audit-level=high
