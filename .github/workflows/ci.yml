name: SDK checks
on:
  push:
    branches: [main, engineering/**]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: ''
      - run: npm test

