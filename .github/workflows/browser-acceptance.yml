name: Phase 6 browser acceptance
on:
  push:
    branches: [main, 'engineering/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  chromium-pwa:
    name: Chromium PWA offline & recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser and Linux dependencies
        run: |
          python -m pip install "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Real browser acceptance (no mocks)
        run: |
          python tests/browser_acceptance.py --browser chromium --output results/chromium-acceptance.json
      - name: Upload acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonder-phase6-chromium-results
          path: results/chromium-acceptance.json
          if-no-files-found: warn
